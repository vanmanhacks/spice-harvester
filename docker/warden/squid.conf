# ─── Scope Enforcement ───
acl allowed_scope dstdomain "/app/scope.txt"
http_access deny !allowed_scope

# ─── Rate Limiting ───
# 16 KB/s aggregate = ~2 requests/second for typical HTTP responses
delay_pools 1
delay_class 1 1
delay_parameters 1 16000/16000
delay_access 1 allow allowed_scope

# ─── Access Control ───
http_access allow allowed_scope
http_access deny all

# ─── Listen ───
http_port 3128

# ─── Privacy ───
forwarded_for delete
via off
